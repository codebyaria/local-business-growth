services:
  - type: pserv
    name: sejuk-cepat-cms-db
    plan: free
    ipAllowList: [] # only allow internal connections from the web service
    # 90-day free trial; Render sends a reminder email before it expires.
  - type: web
    name: sejuk-cepat-cms
    runtime: node
    rootDir: apps/cms
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @sejukcepat/cms build
    startCommand: pnpm --filter @sejukcepat/cms start
    healthCheckPath: /_health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22.11.0'
      - key: HOST
        value: '0.0.0.0'
      - key: PORT
        value: '1337'
      - key: DATABASE_CLIENT
        value: 'postgres'
      - key: DATABASE_URL
        fromDatabase:
          name: sejuk-cepat-cms-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'false'
      - key: APP_KEYS
        sync: false
      - key: API_TOKEN_SALT
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: TRANSFER_TOKEN_SALT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: 'http://127.0.0.1:4321,http://localhost:4321'
      - key: STRAPI_ADMIN_BACKEND_URL
        fromService:
          type: web
          name: sejuk-cepat-cms
          property: host
      - key: PUBLIC_URL
        fromService:
          type: web
          name: sejuk-cepat-cms
          property: host
